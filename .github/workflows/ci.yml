name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://example.com
      LAUNCH_MODE: waitlist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E + accessibility (static preview)
        run: npx playwright test --project=desktop-chrome --project=a11y --project=iphone-15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Lighthouse CI
        run: npm run lhci
        continue-on-error: true
