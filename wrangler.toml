# Cloudflare Pages project configuration.
# Secrets (STRIPE_SECRET_KEY etc.) are NOT set here. Locally they live in .dev.vars;
# in production use `wrangler pages secret put NAME` or the Pages dashboard.
name = "rug-store"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Public, non-secret configuration. Anything prefixed PUBLIC_ is also exposed to the browser.
PUBLIC_SITE_URL = "https://provenantrugs.com"   # [DOMAIN] provenantrugs.com appeared available on 2026-09-28 (RDAP); register it
PUBLIC_BRAND_NAME = "Provenant Rugs"               # [BRAND NAME] chosen by Chris; pending trademark clearance (docs/BRAND.md)
PUBLIC_DEALER_NAME = "Provenant Rugs LLC"         # [DEALER NAME] legal entity for FTC disclosure (form the LLC first)
PUBLIC_PHONE = "+1 (202) 555-0100"               # [PHONE]
PUBLIC_WHATSAPP = "12025550100"                   # [WHATSAPP NUMBER] digits only
PUBLIC_EMAIL = "hello@example.com"                # [CHRIS EMAIL] public support address
PUBLIC_ADDRESS = "1234 Placeholder Ave NW, Suite 100, Washington, DC 20001" # [ADDRESS] DC business address (virtual mailbox is fine)
PUBLIC_LOCAL_AREA = "Washington, DC"              # DC ranks top-3 for "turkish rug" / "oushak rug" search interest; used for local copy
PUBLIC_BOOKING_URL = "https://cal.com/placeholder/live-look"  # [Cal.com or Calendly URL]
PUBLIC_INSTAGRAM = "https://instagram.com/provenantrugs"   # appeared available (unverified); register same day as the domain
PUBLIC_TIKTOK = "https://tiktok.com/@provenantrugs"
PUBLIC_PINTEREST = "https://pinterest.com/provenantrugs"
PUBLIC_YOUTUBE = "https://youtube.com/@provenantrugs"
PUBLIC_GOOGLE_REVIEW_URL = "https://g.page/r/placeholder/review"
LAUNCH_MODE = "waitlist"                          # "waitlist" | "live"
SOLD_INDEX_DAYS = "90"                            # sold rugs stay indexed this long
EMAIL_PROVIDER = "kit"                            # kit | klaviyo | none
ADMIN_EMAIL_PROVIDER = "resend"                   # resend | postmark | mailchannels | none
# ADMIN_EMAIL_FROM is a secret-adjacent runtime value: set it with `wrangler pages secret put ADMIN_EMAIL_FROM`
# (or in the Pages dashboard) to a sender the provider above has verified. JEV_API_KEY, JEV_MODEL and
# JEV_DISABLED (docs/JEV.md) are set the same way; see docs/ENVIRONMENT.md for the full matrix.
RATE_LIMIT_PER_MINUTE = "10"

[[d1_databases]]
binding = "DB"
database_name = "rug-store"
database_id = "00000000-0000-0000-0000-000000000000" # [D1_DATABASE_ID] from `wrangler d1 create rug-store`

[[kv_namespaces]]
binding = "RUG_STATUS"
id = "0000000000000000000000000000dead"            # [KV_NAMESPACE_ID] from `wrangler kv namespace create RUG_STATUS`

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "rug-store-uploads"
